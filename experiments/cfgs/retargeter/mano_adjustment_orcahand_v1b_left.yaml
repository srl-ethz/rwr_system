# Per-finger MANO -> URDF alignment adjustments for orcahand_v1b LEFT hand.
#
# Seeded by mirroring scheme_orcahand_v1b's right-hand mano_adjustment across
# the YZ plane: under an x->-x reflection, an xyz Euler rotation (rx, ry, rz)
# becomes (rx, -ry, -rz), and a translation (tx, ty, tz) becomes (-tx, ty, tz).
# Scales are signless ratios and don't change.
#
# These are STARTING POINTS only. Tune on hardware using the retargeter config
# helper launch (retargeter_config_helper.launch.py) once a left hand is
# physically available -- hardware-specific drift is what this YAML exists to
# correct.
all:
  translation : [0.0, 0.0, -0.01]
  rotation : [0.2, 0.0, -0.2]
  scale : [1.0, 0.7, 1.0]
thumb:
  translation : [0.0, 0.0, 0.0]
  rotation : [0.0, -0.4, 0.0]
  scale : [1.0, 1.0, 1.0]
index:
  translation : [0.0, 0.0, 0.0]
  rotation : [0.0, 0.0, -0.2]
  scale : [1.0, 1.0, 1.0]
middle:
  translation : [0.0, 0.0, 0.0]
  rotation : [0.0, 0.0, -0.2]
  scale : [1.0, 1.0, 1.0]
ring:
  translation : [0.0, 0.0, 0.0]
  rotation : [0.0, 0.0, -0.2]
  scale : [1.0, 1.0, 1.0]
pinky:
  translation : [0.0, 0.0, 0.0]
  rotation : [0.0, 0.0, -0.2]
  scale : [1.0, 1.0, 1.0]
